<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>卡林巴循音</title>
  <meta name="description" content="21 音 C 调卡林巴下落块跟谱练习，支持片段循环、示范播放和离线使用。">
  <meta name="theme-color" content="#bd5f3b">
  <meta name="application-name" content="卡林巴循音">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="卡林巴循音">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./assets/icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="./assets/icons/icon-192.png">
  <link rel="stylesheet" href="./src/styles.css">
</head>
<body>
  <div class="rotate-overlay" id="rotateOverlay">
    <div class="rotate-panel">
      <h2>请横屏练习</h2>
      <p>横屏后能同时看到下落块和琴键。点下面按钮会优先请求系统横屏；如果浏览器不支持，会启用横屏练习模式。</p>
      <button class="accent" id="landscapeBtn" type="button">进入横屏</button>
    </div>
  </div>

  <main class="page">
    <section class="hero">
      <article class="card title-card">
        <div class="app-kicker">听音跟练 · <span id="appVersionText">v2.4.52</span> <button class="version-refresh-btn" id="refreshAppBtn" type="button" title="检查并更新到最新版本" aria-label="检查并更新到最新版本"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M6.1 7a7 7 0 0 1 11.6-1L20 9M4 15l2.3 3A7 7 0 0 0 17.9 17"/></svg></button></div>
        <h1>卡林巴循音</h1>
      </article>

      <aside class="card status-card">
        <div class="meta-grid">
          <div class="meta-box">
            <div class="meta-label">状态</div>
            <div class="meta-value" id="statusText">待开始</div>
          </div>
          <div class="meta-box">
            <div class="meta-label">当前目标</div>
            <div class="meta-value" id="targetText">--</div>
          </div>
        </div>

        <div class="controls">
          <div class="song-wrap current-song-wrap">
            <span class="song-label">曲目</span>
            <strong class="current-song-name" id="currentSongText">《生日快乐》</strong>
            <button class="ghost compact" id="songVersionBtn" type="button" hidden>主旋律版</button>
            <button class="ghost compact" id="pauseBtn" type="button" disabled>暂停</button>
            <button class="ghost compact" id="changeSongBtn" type="button">换曲</button>
          </div>
          <button class="accent" id="startBtn" title="自己弹旋律，手机只播放选定伴奏">自己弹</button>
          <button class="ghost" id="resetBtn">重置</button>
          <button id="demoBtn" title="手机播放旋律和选定伴奏">听示范</button>
          <div class="speed-wrap playback-speed-wrap">
            <label for="speedSlider">速度倍率</label>
            <div class="speed-slider-control">
              <input id="speedSlider" type="range" min="0.35" max="1.4" step="0.05" value="1">
              <button class="normal-speed-mark" id="songSpeedBtn" type="button" title="恢复 1.0 倍原速" aria-label="恢复 1.0 倍原速">1.0</button>
            </div>
            <span class="speed-value" id="speedValue">1.00x</span>
          </div>
          <select id="accompanimentStyleSelect" class="accompaniment-style" aria-label="伴奏编配" title="只由手机播放支持音，不增加需要弹的琴键" hidden>
            <option value="off">无伴奏</option>
            <option value="light">轻伴奏</option>
          </select>
          <button class="ghost compact accompaniment-toggle" id="accompanimentBtn" type="button" hidden>伴奏 开</button>
          <label class="speed-wrap accompaniment-wrap" id="accompanimentVolumeWrap" hidden>
            伴奏音量
            <input id="accompanimentVolumeSlider" type="range" min="0" max="1" step="0.01" value="0.38">
            <span class="speed-value" id="accompanimentVolumeValue">38%</span>
          </label>
        </div>

        <div class="notice" id="secureNotice"></div>
      </aside>
    </section>

    <section class="card board-card">
      <div class="legend">
        <div class="legend-copy">
          <h2 id="practiceTitle">《生日快乐》练习轨道</h2>
          <p class="diagnostic" id="practiceHint"></p>
        </div>
      </div>

      <div class="practice-progress">
          <button id="restartBtn" class="practice-tool-btn practice-icon-btn ghost" type="button" aria-label="从头再练，退出分段练习并倒数后重来" title="退出分段练习，倒数后从全曲开头重来"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M6.1 7a7 7 0 0 1 11.6-1L20 9M4 15l2.3 3A7 7 0 0 0 17.9 17"/></svg></button>
          <span id="songElapsed">0:00</span>
          <div class="progress-track">
          <div
            class="song-progress"
            id="songProgress"
            role="slider"
            tabindex="0"
            aria-label="歌曲进度"
            aria-valuemin="0"
            aria-valuemax="0"
            aria-valuenow="0"
            aria-valuetext="0:00 / 0:00"
          >
            <span class="song-progress-rail" aria-hidden="true"></span>
            <span class="song-progress-fill" id="songProgressFill" aria-hidden="true"></span>
            <span class="song-progress-thumb" id="songProgressThumb" aria-hidden="true"></span>
          </div>
          <span class="loop-selection" id="loopSelection" hidden aria-hidden="true"></span>
          <button id="loopStartHandle" class="loop-handle loop-start" type="button" role="slider" aria-label="循环起点" hidden>起</button>
          <button id="loopEndHandle" class="loop-handle loop-end" type="button" role="slider" aria-label="循环终点" hidden>终</button>
          </div>
          <span id="songRemaining">剩余 0:00</span>
          <button id="repeatBtn" class="practice-tool-btn repeat-btn ghost" type="button" aria-label="开启分段练习" title="开启分段练习" aria-pressed="false">分段练习</button>
          <div class="practice-view-tools">
            <button class="practice-tool-btn ghost compact" id="keyScaleBtn" type="button">键宽 100%</button>
          <button id="fullscreenBtn" class="practice-tool-btn practice-icon-btn ghost" type="button" aria-label="全屏开始" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m8 0h5v-5"/></svg></button>
          </div>
      </div>

      <div class="board-shell">
        <div id="keyWidthStatus" class="key-width-status" role="status" aria-live="polite" hidden></div>
        <div class="board-top" id="boardTop">
          <div id="playbackNotice" class="playback-notice" role="status" aria-live="polite" hidden></div>
          <div id="preparationCue" class="preparation-cue" hidden aria-hidden="true"></div>
          <div class="lane-grid" id="laneGrid"></div>
          <div class="target-strip" id="targetStrip"></div>
          <div class="note-layer" id="noteLayer"></div>
          <div class="judge-line"></div>
        </div>
        <div class="keys-shell">
          <div class="key-row" id="keyRow"></div>
        </div>
      </div>

    </section>
  </main>
  <div class="update-toast" id="updateToast" hidden role="status" aria-live="polite">
    <span id="updateStatusText">发现新版本，点击更新</span>
    <button id="updateNowBtn" type="button">立即更新</button>
    <button class="ghost" id="updateLaterBtn" type="button">稍后</button>
  </div>
  <script type="module" src="./src/app.js"></script>
  <script type="module" src="./src/app-update.js"></script>
</body>
</html>
